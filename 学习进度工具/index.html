<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学习进度 · AI 应用后端</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<aside>
  <div class="brand"><span class="brand-icon">学</span><div>学习进度<small>AI 应用后端 · 12 周</small></div></div>
  <div class="overall"><div><span>整体进度</span><strong id="total">0 / 60 天</strong></div><progress id="progress" max="60" value="0"></progress><small id="hours">累计 0 小时</small></div>
  <nav id="weeks" aria-label="选择学习周"></nav>
  <div class="local-note"><i></i> 保存在本地 Markdown<br><small>每次保存自动备份原文档</small></div>
</aside>
<main>
  <header><div><span class="eyebrow">三个月，循序渐进</span><h1 id="week-title">正在读取学习计划…</h1></div><button id="reload" class="secondary" type="button">重新加载</button></header>
  <p class="subtext">先理解原理，再深入项目，最后把理解变成独立回答。</p>
  <div id="message" role="status" aria-live="polite"></div>
  <div id="days" class="days" aria-label="选择学习日"></div>
  <form id="editor" hidden>
    <section class="card">
      <div class="section-heading"><div><span class="eyebrow" id="day-label"></span><h2 id="day-title"></h2></div><span class="badge" id="day-status"></span></div>
      <div class="fields">
        <label>学习状态<select id="status"></select></label>
        <label>掌握程度<select id="level"></select></label>
        <label>实际日期<input id="date" type="date"></label>
        <label>实际时长（小时）<input id="duration" type="number" min="0" max="24" step="0.1" placeholder="例如 4.5"></label>
      </div>
      <p class="hint">按实际情况选择状态。勾选任务不会自动将当天标为完成。</p>
    </section>
    <section class="card"><div class="section-heading"><h2>今日任务</h2><span class="counter" id="task-count"></span></div><div id="tasks"></div></section>
    <section class="card"><h2>学习记录</h2><p class="hint">留下自己的解释、卡点和下一步，让下次学习顺畅接上。</p><div id="records" class="record-grid"></div></section>
    <details class="card"><summary>本周阅读入口</summary><ul id="references"></ul><p class="hint">对应笔记可在 Obsidian 中按名称查找，优先阅读与当天问题相关的章节。</p></details>
    <details class="card"><summary>本周复盘</summary><div id="review" class="record-grid"></div></details>
    <footer><span id="save-status">尚无未保存的修改</span><button id="save" type="submit">保存到学习文档</button></footer>
  </form>
</main>
</body></html>
